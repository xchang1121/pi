[package]
name = "pi-sandbox-native"
version = "0.0.1"
edition = "2024"
publish = false
description = "Source-built native sandbox backend for Pi speculative actions"

[lib]
name = "pi_sandbox_native"
path = "src/lib.rs"

[[bin]]
name = "pi-sandbox-native"
path = "src/main.rs"

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[profile.release]
opt-level = 2
lto = "thin"
codegen-units = 1
strip = "symbols"
